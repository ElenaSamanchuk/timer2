<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плавающий Таймер</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="timer-floating" id="floating-timer">
      <button
        class="timer-close"
        onclick="document.getElementById('floating-timer').style.display='none'"
      >
        &times;
      </button>
      <div class="timer-title">Закажи сейчас по самой выгодной цене</div>
      <div class="timer" id="timer"></div>
      <a
        href="#menu-plans-v2"
        class="anchor-button"
        onclick="document.getElementById('floating-timer').style.display='none'"
        target="_top"
        >Заказать</a
      >
    </div>
    <script src="script.js"></script>
  </body>
</html>
